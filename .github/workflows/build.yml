name: Build and Release Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # GitHub Releases oluşturmak için zorunlu izin

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: MAC-Vendor-Enricher-Windows.exe
          - os: ubuntu-latest
            asset_name: MAC-Vendor-Enricher-Linux.tar.gz
          - os: macos-latest
            asset_name: MAC-Vendor-Enricher-macOS.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies (Linux Tkinter & PyInstaller)
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y python3-tk
          fi
          pip install pyinstaller
        shell: bash

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onefile --name "MAC-Vendor-Enricher-Windows" --add-data "oui_dataset.json;." --add-data "network_vendors.json;." app.pyw

      - name: Build Linux Binary & Launcher
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconsole --onefile --name "MAC-Vendor-Enricher-Linux" --add-data "oui_dataset.json:." --add-data "network_vendors.json:." app.pyw
          chmod +x dist/MAC-Vendor-Enricher-Linux
          # İzinleri (chmod +x) koruyarak tar.gz içine paketle ve doğrudan binary'yi de kopyala
          tar -czvf dist/MAC-Vendor-Enricher-Linux.tar.gz -C dist MAC-Vendor-Enricher-Linux

      - name: Build macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --onefile --name "MAC-Vendor-Enricher" --add-data "oui_dataset.json:." --add-data "network_vendors.json:." app.pyw
          cd dist
          zip -r MAC-Vendor-Enricher-macOS.zip MAC-Vendor-Enricher.app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/MAC-Vendor-Enricher-Windows.exe
            dist/MAC-Vendor-Enricher-Linux
            dist/MAC-Vendor-Enricher-Linux.tar.gz
            dist/MAC-Vendor-Enricher-macOS.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MAC Vendor Enricher v1.0.0 (Plug & Play)"
          body: |
            ### İndirme ve Kullanım Rehberi (Plug & Play)
            * **Windows:** `MAC-Vendor-Enricher-Windows.exe` dosyasını indirin ve çift tıklayın. Arka planda çalışmaya başlayacak ve masaüstünüze kısayol oluşturacaktır.
            * **macOS:** `MAC-Vendor-Enricher-macOS.zip` dosyasını indirin, arşivden çıkarın ve `MAC-Vendor-Enricher.app` uygulamasına çift tıklayın.
            * **Linux (Ubuntu/Debian):** `MAC-Vendor-Enricher-Linux.tar.gz` arşivini indirin ve klasöre çıkarın (tar.gz çalıştırma izinlerini korur). İlk çalıştırmada masaüstünüze çift tıklanabilir uygulama kısayolunu otomatik oluşturacaktır.
          files: |
            artifacts/MAC-Vendor-Enricher-Windows.exe
            artifacts/MAC-Vendor-Enricher-Linux.tar.gz
            artifacts/MAC-Vendor-Enricher-Linux
            artifacts/MAC-Vendor-Enricher-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
